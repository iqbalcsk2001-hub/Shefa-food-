<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shefa Fruit Juice - Order Now</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #1a365d;
            margin-bottom: 8px;
        }
        p.subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #2d3748;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 15px;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #3182ce;
        }
        .order-btn {
            width: 100%;
            background-color: #25D366;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .order-btn:hover {
            background-color: #1ebc57;
        }
        .note {
            font-size: 12px;
            color: #718096;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Shefa Pure Juice</h2>
    <p class="subtitle">আপনার পছন্দের জুস প্রি-অর্ডার করুন</p>

    <form id="juiceOrderForm">
        <!-- কাস্টমারের নাম -->
        <div class="form-group">
            <label for="name">আপনার নাম:</label>
            <input type="text" id="name" placeholder="আপনার পুরো নাম লিখুন" required>
        </div>

        <!-- মোবাইল নম্বর -->
        <div class="form-group">
            <label for="phone">মোবাইল নম্বর:</label>
            <input type="tel" id="phone" placeholder="018XXXXXXXX" required>
        </div>

        <!-- জুসের আইটেম/ফ্লেভার -->
        <div class="form-group">
            <label for="flavor">জুসের ফ্লেভার/আইটেম সিলেক্ট করুন:</label>
            <select id="flavor" required>
                <option value="" disabled selected>ফ্লেভার বেছে নিন</option>
                <option value="ম্যাজিক স্পেশাল ফ্লেভার (২৫০ মি.লি.)">ম্যাজিক স্পেশাল ফ্লেভার (২৫০ মি.লি.)</option>
                <option value="প্রিমিয়াম ম্যাংগো মিল্ক জুস (২৫০ মি.লি.)">প্রিমিয়াম ম্যাংগো মিল্ক জুস (২৫০ মি.লি.)</option>
                <option value="ন্যাচারাল গ্রেপ জুস (২৫০ মি.লি.)">ন্যাচারাল গ্রেপ জুস (২৫০ মি.লি.)</option>
            </select>
        </div>

              <!-- নির্দিষ্ট ডেলিভারি এলাকার অপশন -->
        <div class="form-group">
            <label for="delivery-area">ডেলিভারির এলাকা / পয়েন্ট সিলেক্ট করুন:</label>
            <select id="delivery-area" required>
                <option value="" disabled selected>আপনার এলাকা বা পয়েন্ট বেছে নিন</option>
                <option value="১. হাজারী টাওয়ার, দোহাজারী">১. হাজারী টাওয়ার, দোহাজারী</option>
                <option value="২. মৌলবির দোকান, উত্তর সাতকানিয়া">২. মৌলবির দোকান, উত্তর সাতকানিয়া</option>
                <option value="৩. বুরো বাংলাদেশ, দোহাজারী ব্রাঞ্চ">৩. বুরো বাংলাদেশ, দোহাজারী ব্রাঞ্চ</option>
                <option value="৪. দেওয়ানহাট, চন্দনাইশ">৪. দেওয়ানহাট, চন্দনাইশ</option>
                <option value="৫. ন্যাশনাল হসপিটাল, দোহাজারী শাখা">৫. ন্যাশনাল হসপিটাল, দোহাজারী শাখা</option>
                <option value="৬. হাছনদন্ডী বহুমুখী উচ্চ বিদ্যালয়">৬. হাছনদন্ডী বহুমুখী উচ্চ বিদ্যালয়</option>
                <option value="৭. খাগরিয়া খাদিম আলী চৌধুরী উচ্চ বিদ্যালয়">৭. খাগরিয়া খাদিম আলী চৌধুরী উচ্চ বিদ্যালয়</option>
                <option value="৮. নুরু মার্কেট, খাগরিয়া">৮. নুরু মার্কেট, খাগরিয়া</option>
                <option value="৯. বটতল ব্রিজ, মজিদার পাড়া">৯. বটতল ব্রিজ, মজিদার পাড়া</option>
                <option value="১০. খাগরিয়া বহুমুখী উচ্চ বিদ্যালয়">১০. খাগরিয়া বহুমুখী উচ্চ বিদ্যালয়</option>
            </select>
        </div>
  <!-- কোয়ান্টিটি/পরিমাণ -->
        <div class="form-group">
            <label for="quantity">কোয়ান্টিটি (কয় বোতল/পিস):</label>
            <input type="number" id="quantity" min="1" value="1" required>
        </div>

        <!-- ডেলিভারির ঠিকানা/স্কুল -->
        <div class="form-group">
            <label for="address">ডেলিভারির স্থান / স্কুলের নাম:</label>
            <textarea id="address" rows="3" placeholder="স্কুলের নাম বা এলাকা লিখুন" required></textarea>
        </div>

        <!-- অর্ডার বাটন -->
        <button type="button" class="order-btn" onclick="sendOrder()">হোয়াটসঅ্যাপে প্রি-অর্ডার করুন</button>
    </form>

    <p class="note">* বাটন এ ক্লিক করলে সরাসরি হোয়াটসঅ্যাপে অর্ডার মেসেজ চলে যাবে।</p>
</div>

<script>
    function sendOrder() {
        var myPhoneNumber = "8801822542428"; 

        var name = document.getElementById("name").value;
        var phone = document.getElementById("phone").value;
        var flavor = document.getElementById("flavor").value;
        var quantity = document.getElementById("quantity").value;
        var address = document.getElementById("address").value;

        if (name == "" || phone == "" || flavor == "" || address == "") {
            alert("দয়া করে সকল তথ্য সঠিকভাবে পূরণ করুন।");
            return;
        }

        var message = "Hello! আমি Shefa জুস প্রি-অর্ডার করতে চাই:%0A%0A" +
                      "👤 *নাম:* " + name + "%0A" +
                      "📞 *ফোন:* " + phone + "%0A" +
                      "🧃 *আইটেম:* " + flavor + "%0A" +
                      "🔢 *পরিমাণ:* " + quantity + " পিস%0A" +
                      "📍 *ঠিকানা/স্কুল:* " + address;

        var whatsappUrl = "https://wa.me/" + myPhoneNumber + "?text=" + message;

        window.open(whatsappUrl, '_blank');
    }
</script>

</body>
</html>
